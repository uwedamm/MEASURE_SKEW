# skew_wizard.cfg - guided 4-orientation MEASURE_SKEW run with Mainsail/Fluidd pop-ups
# Requires: [respond] in printer.cfg, the MEASURE_SKEW extension installed, Cartographer probe.
# Usage: [include skew_wizard.cfg] in printer.cfg, then run SKEW_WIZARD (bed cold).
#        SKEW_WIZARD EDGESCAN=1 scans slowly only around the plate edges (needs a MEASURE_SKEW with EDGESCAN).

[gcode_macro SKEW_WIZARD]
description: Guided 4-orientation MEASURE_SKEW run with UI prompts
variable_run: -1           # current step 0..3, 4 = done, -1 = no wizard running
variable_center_x: 175     # bed centre / Z-homing XY (175 for a 350 Voron)
variable_center_y: 175
variable_park_z: 60        # clearance above the current Z reference while handling the plate
variable_edgescan: 0       # 1 = pass EDGESCAN=1 to MEASURE_SKEW (default for SKEW_WIZARD without EDGESCAN=)
variable_use_edgescan: 0   # internal: mode of the current wizard run
gcode:
  {% set edges = params.EDGESCAN|default(edgescan)|int %}
  {% if edges not in [0, 1] %}
    { action_raise_error("SKEW_WIZARD: EDGESCAN must be 0 or 1") }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=SKEW_WIZARD VARIABLE=run VALUE=0
  SET_GCODE_VARIABLE MACRO=SKEW_WIZARD VARIABLE=use_edgescan VALUE={edges}
  {% if "skew_correction" in printer %}
    SET_SKEW CLEAR=1
  {% endif %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% if "quad_gantry_level" in printer and not printer.quad_gantry_level.applied %}
    QUAD_GANTRY_LEVEL
    G28 Z
  {% elif "z_tilt" in printer and not printer.z_tilt.applied %}
    Z_TILT_ADJUST
    G28 Z
  {% endif %}
  G90
  G1 X{center_x} Y{center_y} Z{park_z} F6000
  _SKEW_ASK

[gcode_macro _SKEW_ASK]
gcode:
  {% set run = printer["gcode_macro SKEW_WIZARD"].run %}
  RESPOND TYPE=command MSG="action:prompt_begin Skew measurement {run + 1} of 4"
  {% if run == 0 %}
    RESPOND TYPE=command MSG="action:prompt_text Place the plate under the probe, roughly centred and square. Z will home on top of the plate."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_text Rotate the plate 90 degrees COUNTER-CLOCKWISE. Do not flip it. Z will re-home on the plate."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_SKEW_CANCEL|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Measure|_SKEW_STEP STEP={run}|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _SKEW_STEP]
# STEP is the step of the pop-up the Measure button belongs to. A click that was
# queued while a step was running (or a typed _SKEW_STEP) arrives after the next
# pop-up and must not start the next step before the plate was rotated.
gcode:
  {% set w = printer["gcode_macro SKEW_WIZARD"] %}
  {% set step = params.STEP|default(-1)|int %}
  {% if w.run < 0 or w.run > 3 %}
    RESPOND MSG="SKEW_WIZARD: no measurement step is pending, ignored. Start with SKEW_WIZARD."
  {% elif step != w.run %}
    RESPOND MSG="SKEW_WIZARD: ignored a Measure that was not for step {w.run + 1} (clicked while a step was running?). Use the Measure button of the current pop-up."
  {% else %}
    {% set next = w.run + 1 %}
    RESPOND TYPE=command MSG="action:prompt_end"
    G90
    G1 X{w.center_x} Y{w.center_y} F6000
    G28 Z
    MEASURE_SKEW XCENTER={w.center_x} YCENTER={w.center_y}{" EDGESCAN=1" if w.use_edgescan else ""}
    G1 Z{w.park_z} F900
    SET_GCODE_VARIABLE MACRO=SKEW_WIZARD VARIABLE=run VALUE={next}
    {% if next < 4 %}
      _SKEW_ASK
    {% else %}
      _SKEW_REMOVE_PLATE TITLE="Skew measurement complete" TEXT="Results are in the console. Remove the plate, then re-home Z on the bed."
    {% endif %}
  {% endif %}

[gcode_macro _SKEW_CANCEL]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  G91
  G1 Z10 F900
  G90
  SET_GCODE_VARIABLE MACRO=SKEW_WIZARD VARIABLE=run VALUE=-1
  _SKEW_REMOVE_PLATE TITLE="Skew measurement cancelled" TEXT="Remove the plate, then re-home Z on the bed. MEASURE_SKEW keeps its own run count. FIRMWARE_RESTART before starting again."

[gcode_macro _SKEW_REMOVE_PLATE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin {params.TITLE}"
  RESPOND TYPE=command MSG="action:prompt_text {params.TEXT}"
  RESPOND TYPE=command MSG="action:prompt_footer_button Plate removed - home Z|_SKEW_FINISH|warning"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _SKEW_FINISH]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  G28 Z
  G1 Z10 F900
  RESPOND MSG="Z re-homed on the bed. Safe to print."
